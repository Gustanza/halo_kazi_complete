spring.application.name=halokazi-backend
# 8081 so it never collides with other local dev servers on 8080; the Vite proxy (vite.config.js) points here.
server.port=${SERVER_PORT:8081}

# Database: environment variables (or a .env file) override the shared VPS defaults.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//161.97.99.40:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:halokazi}
spring.datasource.password=${DB_PASSWORD:zl57xWweDRtYHbesNsaowsWw}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Halokazi application settings. Business rules (OTP TTL, lockout, idle timeout...) live in
# the SYSTEM_SETTING table; only technical knobs belong here.
halokazi.cors.allowed-origins=http://localhost:5173
halokazi.session.absolute-ttl=12h
halokazi.session.activity-write-interval=30s
halokazi.otp.resend-cooldown=30s
halokazi.otp.max-verify-attempts=5
halokazi.settings.cache-ttl=60s
halokazi.sms.gateway=logging
